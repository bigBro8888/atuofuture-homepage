<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" href="/src/styles/main.css"/>
<title>安托未来 | 物理AI空间智能服务商</title>
<meta name="description" content="安托未来以AI智能体为大脑、以智能硬件为感知与执行终端，为楼宇、园区及各类空间提供开放、自治、可规模交付的空间智能解决方案。" />
</head>
<body class="bg-background text-on-surface font-body-md" data-page="home" data-nav-depth="0">
<div id="site-header"></div>

<!-- 1. Hero 轮播：五大技术优势（内容由 home-advantages 数据驱动渲染） -->
<section class="sm-hero ha-hero" data-sm-hero aria-roledescription="轮播" aria-label="安托未来空间智能与技术优势">
<div class="sm-hero__track" data-sm-hero-track></div>
<div class="sm-hero__controls max-w-max-width mx-auto px-margin-desktop">
<div class="sm-hero__pager">
<button type="button" class="sm-hero__pause" data-sm-hero-pause aria-label="暂停自动轮播" aria-pressed="false">
<svg class="sm-hero__pause-icon sm-hero__pause-icon--pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
<svg class="sm-hero__pause-icon sm-hero__pause-icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
</button>
<div class="sm-hero__dots" data-sm-hero-dots></div>
</div>
<button type="button" class="sm-hero__nav sm-hero__nav--prev" data-sm-hero-prev aria-label="上一页">
<svg class="sm-hero__nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button type="button" class="sm-hero__nav sm-hero__nav--next" data-sm-hero-next aria-label="下一页">
<svg class="sm-hero__nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>
</section>

<div id="home-main"></div>
<div id="demo-modal" class="demo-modal" aria-hidden="true">
<div class="demo-modal__backdrop" data-demo-modal-close></div>
<div class="demo-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="demo-title">
<button type="button" class="demo-modal__close" data-demo-modal-close aria-label="关闭"><span class="material-symbols-outlined">close</span></button>
<div class="demo-modal__intro">
<h3 id="demo-title">预约方案演示</h3>
<p>留下需求与联系方式，我们会尽快与您对接。</p>
</div>
<form id="demo-request-form" class="demo-form">
<label>您的姓名<input name="name" required placeholder="怎么称呼您"/></label>
<label>联系方式<input name="contact" required placeholder="手机或邮箱"/></label>
<label>需求说明<textarea name="requirement" rows="4" required placeholder="空间类型、规模、关注场景等"></textarea></label>
<p class="demo-form__tip" id="demo-form-tip"></p>
<button type="submit" class="site-header__btn site-header__btn--primary w-full">提交预约</button>
</form>
</div>
</div>

<div id="site-footer"></div>
<script type="module" src="/src/scripts/main.js"></script>
</body>
</html>
